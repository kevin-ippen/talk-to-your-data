# Databricks App configuration for Live Voice Kit
# Deploy: databricks apps deploy <app-name>
#
# SECRETS: LIVEKIT_API_KEY and LIVEKIT_API_SECRET must be stored in a
# Databricks secret scope, then referenced here. NEVER commit plaintext
# credentials to source control.
#
# Setup:
#   databricks secrets create-scope live-voice
#   databricks secrets put-secret live-voice livekit-api-key
#   databricks secrets put-secret live-voice livekit-api-secret
#   databricks secrets put-secret live-voice livekit-url
command:
  - python
  - -m
  - src.main

env:
  - name: GENIE_SPACE_ID
    value: "01f1a88ca4a011bb9e7a3a8d4e79fd03"
  - name: GENIE_MODE
    description: "Genie runtime mode: agent (SSE streaming), chat (polling), or mcp (Genie One workspace-wide)"
    value: "agent"
  - name: LIVEKIT_URL
    valueFrom:
      secret:
        scope: live-voice
        key: livekit-url
  - name: LIVEKIT_API_KEY
    valueFrom:
      secret:
        scope: live-voice
        key: livekit-api-key
  - name: LIVEKIT_API_SECRET
    valueFrom:
      secret:
        scope: live-voice
        key: livekit-api-secret
  - name: VOICE_PROFILE
    description: Voice quality profile (premium/balanced/private/hybrid)
    value: premium
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

resources:
  - name: sql-warehouse
    sql_warehouse:
      permission: CAN_USE
