# Databricks App configuration for Live Voice Kit
# Deploy: databricks apps deploy <app-name>
command:
  - python
  - -m
  - src.main

env:
  - name: GENIE_SPACE_ID
    value: "01f1a88ca4a011bb9e7a3a8d4e79fd03"
  - name: GENIE_MODE
    description: "Genie runtime mode: agent (SSE streaming), chat (polling), or mcp (Genie One workspace-wide)"
    value: "agent"
  - name: LIVEKIT_URL
    value: "wss://talk-to-your-data-w51pqf4d.livekit.cloud"
  - name: LIVEKIT_API_KEY
    value: "APIJmBwQZoymeZm"
  - name: LIVEKIT_API_SECRET
    value: "AfDyU9eT8kwacwBCvrMxPAgNe2mfg5fX4j6dngMev3gC"
  - name: VOICE_PROFILE
    description: Voice quality profile (premium/balanced/private/hybrid)
    value: premium
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

resources:
  - name: sql-warehouse
    sql_warehouse:
      permission: CAN_USE
