# Databricks App configuration for Live Voice Kit
# Deploy: databricks apps deploy <app-name>
#
# LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET are NOT in this file.
# Set them through the Databricks Apps UI (Environment Variables tab).
# They persist across redeployments and are never stored in source control.
command:
  - python
  - -m
  - src.main

env:
  - name: GENIE_SPACE_ID
    value: "01f1a88ca4a011bb9e7a3a8d4e79fd03"
  - name: GENIE_MODE
    description: "Genie runtime mode: agent (SSE streaming), chat (polling), or mcp (Genie One workspace-wide)"
    value: "mcp"
  - name: VOICE_PROFILE
    description: Voice quality profile (premium/balanced/private/hybrid)
    value: premium
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

resources:
  - name: sql-warehouse
    sql_warehouse:
      permission: CAN_USE
