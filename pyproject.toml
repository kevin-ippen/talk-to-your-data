[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-live-voice"
version = "0.1.0"
description = "Add a natural, interruptible live voice interface to any Databricks application"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents>=1.6.9",
    "livekit-plugins-openai>=1.0.0",
    "livekit-api>=1.0.0",
    "databricks-sdk>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
